# Quick-answer overlay: same 650M-row dataset as the steps test, loaded without the
# per-loader throttle; the test still waits for compactions and tablet splits before measuring.
prepare_write_cmd: [
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=1..162500001",
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=162500002..325000002",
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=325000003..487500003",
    "cassandra-stress write  cl=ALL n=162500001 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode connectionsPerHost=8 cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)'  -pop seq=487500004..650000004"
]
